<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23A98BE8'/%3E%3Cstop offset='1' stop-color='%237C5CBF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 3C16 3 6 14 6 20a10 10 0 0020 0C26 14 16 3 16 3z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>Menstruation Tracker</title>
    <script>
      /* Pre-paint theme: colours saved by the previous run, so a launch never flashes the wrong theme. */
      try {
        var b = JSON.parse(localStorage.getItem("mt.boot.v1") || "null");
        if (b && b.canvas) {
          var r = document.documentElement;
          r.style.setProperty("--c-canvas", b.canvas);
          r.style.setProperty("--c-ink", b.ink);
          r.style.setProperty("--c-accent", b.accent);
          r.style.colorScheme = b.mode;
          r.style.background = b.canvas;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
