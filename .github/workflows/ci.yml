name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, lint, test, and verify versions
        run: npm run check

      - name: Build frontend bundle
        run: npm run build

  go:
    name: Go worker scaffold tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: services/go-worker/go.mod

      - name: Test Go worker
        run: go test ./...
        working-directory: services/go-worker

  rust:
    name: Windows native tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build frontend required by Tauri context
        run: npm run build

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run native unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
